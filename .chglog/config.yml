style: github
template: CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/mikcompany/ravireader
options:
  commits:
    filters:
      Type:
        - feat
        - fix
        - perf
        - refactor
        - build
        - docs
  commit_groups:
    title_maps:
      feat: Features
      fix: Bug Fixes
      perf: Performance Improvements
      refactor: Code Refactoring
      build: Build System
      docs: Documentation
  header:
    pattern: "^(\\w*)\\s*(?:\\((.*)\\))?\\:\\s*(.*)$"
    pattern_maps:
      - Type
      - Scope
      - Subject
  notes:
    keywords:
      - BREAKING CHANGE
